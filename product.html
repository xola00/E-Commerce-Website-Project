<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ETOAC | Product</title>

  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* ========= RESET ========= */
    *{ box-sizing:border-box; }
    html,body{ margin:0; padding:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    a{ color:inherit; text-decoration:none; }
    img{ max-width:100%; display:block; }
    button,input,select{ font:inherit; }
    .sr-only{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }

    /* ========= THEME ========= */
    :root{
      --bg:#ffffff;
      --bg2:#f3f4f6;
      --text:#111827;
      --muted:#6b7280;
      --card:#ffffff;
      --border:#e5e7eb;
      --shadow:0 8px 24px rgba(17,24,39,.08);

      --nav:#408ef3;
      --nav2:#232f3e;
      --accent:#69f9fe;
      --link:#0b74de;
      --danger:#dc2626;
      --success:#10b981;
    }
    body[data-theme="dark"]{
      --bg:#0b1220;
      --bg2:#0f1a2d;
      --text:#e5e7eb;
      --muted:#94a3b8;
      --card:#0f1a2d;
      --border:#1f2a44;
      --shadow:0 10px 26px rgba(0,0,0,.35);
    }
    body{ background:var(--bg2); color:var(--text); }

    /* ========= HEADER ========= */
    .amz-header{ position:sticky; top:0; z-index:50; }
    .amz-header__top{
      display:grid;
      grid-template-columns: 1fr minmax(260px,740px) auto;
      gap:12px;
      align-items:center;
      padding:10px 12px;
      background:var(--nav);
      color:#fff;
    }
    .amz-brand{ display:flex; gap:10px; align-items:center; min-width:190px; }
    .amz-brand__logo{
      width:40px; height:40px; object-fit:contain;
      border-radius:8px; background:rgba(255,255,255,.06); padding:4px;
    }
    .amz-brand__name{ font-weight:900; line-height:1.1; font-size:14px; }
    .amz-brand__tagline{ font-size:12px; opacity:.85; }

    .amz-search{
      display:flex; background:#fff; border-radius:10px; overflow:hidden;
      border:2px solid transparent;
    }
    .amz-search:focus-within{ border-color:var(--accent); }
    .amz-search__select{ border:0; padding:10px 10px; background:#f3f4f6; color:#111827; max-width:170px; }
    .amz-search__input{ border:0; padding:10px 12px; width:100%; outline:none; }
    .amz-search__btn{
      border:0; background:var(--accent); padding:0 14px; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
    }
    .amz-search__btn svg{ width:20px; height:20px; fill:#111827; }

    .amz-actions{ display:flex; align-items:center; gap:10px; }
    .amz-action__btn{
      width:38px; height:38px; border-radius:10px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.06);
      color:#fff; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
    }
    .amz-action__btn svg{ width:18px; height:18px; fill:#fff; }

    .amz-action__link{
      display:flex; flex-direction:column; gap:2px;
      padding:6px 10px; border-radius:10px;
      border:1px solid rgba(255,255,255,.12);
    }
    .amz-action__small{ font-size:11px; opacity:.9; }
    .amz-action__big{ font-size:13px; font-weight:900; }

    .amz-cart{
      position:relative;
      display:flex; align-items:center; gap:8px;
      padding:8px 10px;
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.12);
      color:#fff; border-radius:10px; cursor:pointer;
    }
    .amz-cart__badge{
      position:absolute; top:-6px; left:18px;
      background:var(--danger); color:#fff;
      border-radius:999px; padding:2px 6px;
      font-size:12px; font-weight:900;
    }
    .amz-cart__text{ font-weight:900; font-size:13px; }

    .amz-navToggle{
      display:none;
      width:42px; height:42px;
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.12);
      border-radius:10px; cursor:pointer;
      flex-direction:column; justify-content:center; gap:5px;
      padding:0 10px;
    }
    .amz-navToggle span{ height:2px; background:#fff; border-radius:9px; display:block; }

    .amz-header__strip{
      display:flex; justify-content:space-between; gap:10px;
      padding:8px 12px;
      background:var(--nav2);
      color:#fff;
      overflow:auto;
    }
    .amz-strip__left{ display:flex; gap:10px; align-items:center; flex-wrap:nowrap; }
    .amz-strip__item{
      padding:6px 10px; border-radius:999px;
      border:1px solid rgba(255,255,255,.12);
      white-space:nowrap; font-size:13px;
    }

    /* ========= MAIN ========= */
    .amz-main{ padding:14px 12px 28px; max-width:1280px; margin:0 auto; }

    .crumbs{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; color:var(--muted); font-size:13px; }
    .crumbs a{ color:var(--link); font-weight:900; }
    .sep{ opacity:.7; }

    .shell{
      margin-top:12px;
      display:grid;
      grid-template-columns: 1.1fr .9fr;
      gap:14px;
      align-items:start;
    }

    .panel{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:12px;
      box-shadow:var(--shadow);
      overflow:hidden;
    }

    /* ========= GALLERY ========= */
    .gallery{
      padding:12px;
    }
    .mainImg{
      border:1px solid var(--border);
      border-radius:12px;
      background:var(--bg);
      height:420px;
      display:flex; align-items:center; justify-content:center;
      overflow:hidden;
    }
    .mainImg img{
      max-height:100%;
      max-width:100%;
      object-fit:contain;
    }
    .thumbs{
      margin-top:10px;
      display:flex;
      gap:10px;
      overflow:auto;
      padding-bottom:6px;
    }
    .thumb{
      width:72px;
      height:72px;
      border-radius:12px;
      border:1px solid var(--border);
      background:var(--bg);
      flex:0 0 auto;
      display:flex; align-items:center; justify-content:center;
      cursor:pointer;
      overflow:hidden;
      opacity:.92;
      transition:transform .15s ease, opacity .15s ease;
    }
    .thumb:hover{ transform:translateY(-1px); opacity:1; }
    .thumb.active{ outline:2px solid var(--accent); outline-offset:2px; opacity:1; }
    .thumb img{ max-width:100%; max-height:100%; object-fit:contain; }

    /* ========= DETAILS ========= */
    .details{ padding:12px; }
    .title{ margin:0; font-size:20px; font-weight:900; line-height:1.15; }
    .desc{ margin:8px 0 0; color:var(--muted); font-size:13px; }

    .dealBox{
      margin-top:12px;
      border:2px solid var(--danger);
      border-radius:12px;
      padding:10px;
      background:rgba(220,38,38,.06);
    }
    body[data-theme="dark"] .dealBox{ background:rgba(220,38,38,.10); }
    .dealTop{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
    .dealBadge{
      display:inline-flex; align-items:center;
      padding:4px 10px;
      border-radius:8px;
      background:var(--danger);
      color:#fff;
      font-weight:900;
      font-size:12px;
      width:fit-content;
    }
    .dealTimer{ font-size:12px; color:var(--danger); font-weight:900; }

    .priceRow{ display:flex; align-items:baseline; gap:10px; margin-top:8px; }
    .priceNow{ font-size:22px; font-weight:900; color:var(--danger); }
    .priceWas{ font-size:13px; color:var(--muted); text-decoration:line-through; }

    .optRow{ margin-top:12px; display:flex; flex-direction:column; gap:8px; }
    .optRow label{ font-size:12px; color:var(--muted); font-weight:900; }
    select{
      width:100%;
      border:1px solid var(--border);
      border-radius:10px;
      padding:10px 10px;
      background:var(--bg);
      color:var(--text);
      outline:none;
    }

    .actions{
      margin-top:12px;
      display:flex;
      gap:10px;
    }
    .btn{
      border:1px solid var(--border);
      background:var(--bg2);
      color:var(--text);
      padding:10px 12px;
      border-radius:10px;
      cursor:pointer;
      font-weight:900;
      font-size:13px;
      flex:1;
      transition:all 0.2s ease;
    }
    .btn.primary{
      background:var(--accent);
      border-color:rgba(0,0,0,.15);
      color:#111827;
    }
    .btn:hover{ background:var(--border); }
    .btn.primary:hover{ background:var(--success); border-color:var(--success); }
    .btn:disabled{ opacity:.6; cursor:not-allowed; }

    .metaGrid{
      margin-top:12px;
      display:grid;
      grid-template-columns: repeat(2, 1fr);
      gap:10px;
    }
    .metaCard{
      border:1px solid var(--border);
      border-radius:12px;
      padding:10px;
      background:var(--bg);
    }
    .metaKey{ font-size:11px; color:var(--muted); font-weight:900; }
    .metaVal{ margin-top:4px; font-weight:900; font-size:13px; }

    .notice{
      border:1px dashed var(--border);
      border-radius:14px;
      background:rgba(255,255,255,.6);
      padding:12px;
      color:var(--muted);
      font-size:13px;
    }
    body[data-theme="dark"] .notice{ background:rgba(15,26,45,.6); }

    /* ========= RESPONSIVE ========= */
    @media (max-width:1100px){
      .shell{ grid-template-columns: 1fr; }
      .mainImg{ height:360px; }
    }
    @media (max-width:760px){
      .amz-header__top{
        grid-template-columns: 1fr auto;
        grid-template-areas:
          "brand actions"
          "search search";
      }
      .amz-brand{ grid-area:brand; min-width:0; }
      .amz-actions{ grid-area:actions; }
      .amz-search{ grid-area:search; }
      .amz-action__link{ display:none; }
      .amz-navToggle{ display:flex; }
      .amz-header__strip{ display:none; flex-direction:column; align-items:flex-start; }
      .amz-header__strip.open{ display:flex; }
      .mainImg{ height:300px; }
      .metaGrid{ grid-template-columns: 1fr; }
    }
  </style>
</head>

<body data-page="product" class="amz">
  <!-- HEADER -->
  <header class="amz-header">
    <div class="amz-header__top">
      <a class="amz-brand" href="index.html" aria-label="Go to home">
        <img class="amz-brand__logo" src="images/logo.png" alt="ETOAC logo" />
        <div class="amz-brand__text">
          <div class="amz-brand__name">ETOAC Cleaning & Arts</div>
          <div class="amz-brand__tagline">Clean Spaces. Crafted Stories.</div>
        </div>
      </a>

      <form class="amz-search" id="searchForm" role="search">
        <select class="amz-search__select" id="searchCategory" aria-label="Search category">
          <option value="">All</option>
        </select>
        <input class="amz-search__input" id="searchInput" type="search" placeholder="Search products..." autocomplete="off" />
        <button class="amz-search__btn" type="submit" aria-label="Search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 2a8 8 0 105.293 14.293l4.707 4.707 1.414-1.414-4.707-4.707A8 8 0 0010 2zm0 2a6 6 0 110 12 6 6 0 010-12z"></path></svg>
        </button>
      </form>

      <div class="amz-actions">
        <button class="amz-action__btn" type="button" id="themeToggle" aria-pressed="false" title="Toggle theme">
          <span class="sr-only">Toggle theme</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        </button>

        <a class="amz-action__link" href="orders.html" title="Orders">
          <span class="amz-action__small">Returns</span>
          <span class="amz-action__big">& Orders</span>
        </a>

        <a class="amz-action__link" href="account.html" title="Account">
          <span class="amz-action__small">Hello</span>
          <span class="amz-action__big">Account</span>
        </a>

        <button class="amz-cart" type="button" onclick="window.location.href='cart.html'" aria-label="Open cart">
          <span class="amz-cart__icon" aria-hidden="true">🛒</span>
          <span class="amz-cart__badge" id="cart-count">0</span>
          <span class="amz-cart__text">Cart</span>
        </button>

        <button class="amz-navToggle" type="button" id="navToggle" aria-expanded="false" aria-controls="amzNav">
          <span></span><span></span><span></span>
          <span class="sr-only">Open menu</span>
        </button>
      </div>
    </div>

    <div class="amz-header__strip" id="amzNav">
      <div class="amz-strip__left">
    <a class="amz-strip__item" href="category.html?cat=cleaning">Cleaning</a>
<a class="amz-strip__item" href="category.html?cat=art">Art Work</a>
<a class="amz-strip__item" href="category.html?cat=outdoor">Outdoor</a>
        <a class="amz-strip__item" href="combos.html">Combos</a>
        <a class="amz-strip__item" href="specials.html">Specials</a>
        <a class="amz-strip__item" href="about.html">About</a>
        <a class="amz-strip__item" href="contact.html">Contact</a>
      </div>
    </div>
  </header>

  <main class="amz-main">
    <div class="crumbs" id="crumbs">
      <a href="index.html">Home</a> <span class="sep">›</span>
      <a href="products.html">Products</a> <span class="sep">›</span>
      <span id="crumbName">Loading…</span>
    </div>

    <div id="pageWrap" class="notice" style="margin-top:12px;">Loading product…</div>
  </main>

  <script>
    /******************************************************************
     *  SUPABASE CLIENT
     ******************************************************************/
    

    (() => {
      const sb = window.supabaseClient;
      if (!sb) { alert("Supabase client not found."); return; }

      // ======= CONFIG =======
      const PRODUCT_IMAGES_BUCKET = "product-images";
      const FALLBACK_IMG = "images/Combo.jpg";
      const SPECIALS_TIME_MODE = "assume_jhb";
      const JHB_OFFSET = "+02:00";

      // ======= HELPERS =======
      const $ = (id) => document.getElementById(id);
      function safeText(s){ return (s ?? "").toString(); }
      function isHttp(url){ return /^https?:\/\//i.test(url); }
      function formatMoney(amount){
        const n = Number(amount || 0);
        return "R " + n.toFixed(2);
      }
      function getSessionId(){
        const key = "etoac_session_id";
        let v = localStorage.getItem(key);
        if (!v) { v = "sess_" + crypto.randomUUID(); localStorage.setItem(key, v); }
        return v;
      }
      function productImageUrl(path){
        if (!path) return "";
        if (isHttp(path) || path.startsWith("images/") || path.startsWith("assets/")) return path;
        try {
          const { data } = sb.storage.from(PRODUCT_IMAGES_BUCKET).getPublicUrl(path);
          return data?.publicUrl || path;
        } catch { return path; }
      }
      function formatLeft(ms){
        const total = Math.max(0, Math.floor(ms / 1000));
        const h = String(Math.floor(total / 3600)).padStart(2,"0");
        const m = String(Math.floor((total % 3600) / 60)).padStart(2,"0");
        const s = String(total % 60).padStart(2,"0");
        return `${h}:${m}:${s}`;
      }
      function parseSpecialEpoch(ts){
        if (!ts) return null;
        const raw = String(ts).trim();

        const first = new Date(raw);
        const firstOk = Number.isFinite(first.getTime());

        if (SPECIALS_TIME_MODE === "db_utc") return firstOk ? first.getTime() : null;

        const looksUTC =
          /Z$/i.test(raw) ||
          /\+00(?::?00)?$/i.test(raw) ||
          /\+0000$/i.test(raw);

        if (looksUTC) {
          const fixed = raw
            .replace(/Z$/i, JHB_OFFSET)
            .replace(/\+00(?::?00)?$/i, JHB_OFFSET)
            .replace(/\+0000$/i, JHB_OFFSET);

          const d = new Date(fixed);
          if (Number.isFinite(d.getTime())) return d.getTime();
        }

        return firstOk ? first.getTime() : null;
      }
      function calcDiscountedPrice(basePrice, sp){
        const base = Number(basePrice);
        if (!Number.isFinite(base)) return null;
        const dv = Number(sp.discount_value);
        if (sp.discount_type === "percentage") return base * (1 - (dv / 100));
        if (sp.discount_type === "fixed_amount") return Math.max(0, base - dv);
        return base;
      }

      // ======= THEME / NAV / SEARCH =======
      function initTheme(){
        const key = "etoac_theme";
        const saved = localStorage.getItem(key);
        if (saved) document.body.setAttribute("data-theme", saved);
        const btn = $("themeToggle");
        if (!btn) return;
        btn.addEventListener("click", () => {
          const cur = document.body.getAttribute("data-theme") || "light";
          const next = cur === "dark" ? "light" : "dark";
          document.body.setAttribute("data-theme", next);
          localStorage.setItem(key, next);
          btn.setAttribute("aria-pressed", next === "dark" ? "true" : "false");
        });
      }
      function initMobileNav(){
        const toggle = $("navToggle");
        const nav = $("amzNav");
        if (!toggle || !nav) return;
        toggle.addEventListener("click", () => {
          const isOpen = nav.classList.toggle("open");
          toggle.setAttribute("aria-expanded", isOpen ? "true" : "false");
        });
      }
      function initSearch(){
        const form = $("searchForm");
        const input = $("searchInput");
        const cat = $("searchCategory");
        if (!form || !input || !cat) return;

        form.addEventListener("submit", (e) => {
          e.preventDefault();
          const q = input.value.trim();
          const c = cat.value.trim();
          const params = new URLSearchParams();
          if (q) params.set("q", q);
          if (c) params.set("cat", c);
          window.location.href = `shop.html?${params.toString()}`;
        });
      }
      async function loadCategoriesIntoSearch(){
        const select = $("searchCategory");
        if (!select) return;
        const { data, error } = await sb
          .from("categories")
          .select("slug, name")
          .eq("is_active", true)
          .order("sort_order", { ascending: true });
        if (error) return;
        (data || []).forEach(c => {
          const opt = document.createElement("option");
          opt.value = c.slug;
          opt.textContent = c.name;
          select.appendChild(opt);
        });
      }

      // ======= CART =======
      async function refreshCartCount(){
        const sessionId = getSessionId();
        const { data, error } = await sb
          .from("cart")
          .select("quantity")
          .eq("session_id", sessionId);
        if (error) return;
        const count = (data || []).reduce((sum, r) => sum + (Number(r.quantity) || 0), 0);
        const el = $("cart-count");
        if (el) el.textContent = String(count);
      }
      async function addToCart(productId, variantId, qty=1){
        const sessionId = getSessionId();

        const { data: existing, error: selErr } = await sb
          .from("cart")
          .select("quantity")
          .eq("session_id", sessionId)
          .eq("product_id", productId)
          .eq("variant_id", variantId)
          .maybeSingle();

        if (selErr) console.warn("Cart select error:", selErr.message);

        if (existing?.quantity != null) {
          const newQty = (Number(existing.quantity) || 0) + qty;
          const { error: updErr } = await sb
            .from("cart")
            .update({ quantity: newQty })
            .eq("session_id", sessionId)
            .eq("product_id", productId)
            .eq("variant_id", variantId);
          if (updErr) { alert("Could not update cart: " + updErr.message); return; }
        } else {
          const { error: insErr } = await sb
            .from("cart")
            .insert({ session_id: sessionId, product_id: productId, variant_id: variantId, quantity: qty });
          if (insErr) { alert("Could not add to cart: " + insErr.message); return; }
        }

        await refreshCartCount();
      }

      // ======= URL PARAMS =======
      function getParam(name){
        return new URLSearchParams(window.location.search).get(name);
      }

      // ======= LOADERS =======
      async function loadProductBySlugOrId(){
        const slug = getParam("slug");
        const id = getParam("id");

        if (!slug && !id) throw new Error("Missing product slug or id in URL.");

        let q = sb.from("products").select("id, category_id, name, slug, description, is_active, created_at");

        if (slug) q = q.eq("slug", slug).maybeSingle();
        else q = q.eq("id", id).maybeSingle();

        const { data, error } = await q;
        if (error) throw error;
        if (!data) throw new Error("Product not found.");
        if (data.is_active === false) throw new Error("This product is not active.");

        return data;
      }

      async function loadProductImages(productId){
        const { data, error } = await sb
          .from("product_images")
          .select("id, product_id, path, alt, sort_order, is_primary")
          .eq("product_id", productId)
          .order("is_primary", { ascending: false })
          .order("sort_order", { ascending: true });

        if (error) { console.warn("Images load failed:", error.message); return []; }
        return data || [];
      }

      async function loadVariants(productId){
        const { data, error } = await sb
          .from("product_variants")
          .select("id, product_id, label, price, sort_order, is_default, is_active, Image_path")
          .eq("product_id", productId)
          .eq("is_active", true)
          .order("sort_order", { ascending: true });

        if (error) throw error;
        return data || [];
      }

      async function loadActiveSpecialsForProduct(productId, variantIds){
        const { data, error } = await sb
          .from("specials")
          .select("id, title, description, discount_type, discount_value, product_id, variant_id, starts_at, ends_at, is_active, created_at")
          .eq("is_active", true)
          .eq("product_id", productId)
          .order("created_at", { ascending: false })
          .limit(200);

        if (error) { console.warn("Specials load failed:", error.message); return { byVariant: new Map(), productWide: null }; }

        const now = Date.now();
        const active = (data || []).filter(sp => {
          const startMs = parseSpecialEpoch(sp.starts_at);
          const endMs = parseSpecialEpoch(sp.ends_at);
          const startOk = (startMs == null) || (startMs <= now);
          const endOk = (endMs == null) || (endMs >= now);
          return startOk && endOk;
        });

        const byVariant = new Map();
        let productWide = null;

        for (const sp of active) {
          if (sp.variant_id) {
            if (variantIds.includes(sp.variant_id) && !byVariant.has(sp.variant_id)) byVariant.set(sp.variant_id, sp);
          } else {
            if (!productWide) productWide = sp;
          }
        }

        return { byVariant, productWide };
      }

      // ======= RENDER =======
      function pickPrimaryImageFromList(images){
        const list = images || [];
        const primary = list.find(i => i.is_primary) || [...list].sort((a,b)=>(a.sort_order||0)-(b.sort_order||0))[0];
        return primary ? productImageUrl(primary.path) : FALLBACK_IMG;
      }

      function renderPage(product, images, variants, specials){
        const wrap = $("pageWrap");
        const crumbName = $("crumbName");
        if (crumbName) crumbName.textContent = safeText(product.name);

        if (!wrap) return;

        const primary = pickPrimaryImageFromList(images);
        const thumbs = (images || []).map(i => ({
          src: productImageUrl(i.path),
          alt: i.alt || product.name
        }));
        if (!thumbs.length) thumbs.push({ src: primary, alt: product.name });

        // Pre-select variant from URL if exists
        const variantParam = getParam("variant");
        let selectedVariant = null;

        if (variantParam) selectedVariant = variants.find(v => String(v.id) === String(variantParam)) || null;
        if (!selectedVariant) selectedVariant = variants.find(v => v.is_default) || variants[0] || null;

        // Special for selected variant (variant overrides product-wide)
        function getSpecialForVariant(variantId){
          return specials.byVariant.get(variantId) || specials.productWide || null;
        }

        function variantImage(v){
          if (v?.Image_path) return productImageUrl(v.Image_path);
          return primary;
        }

        wrap.className = "";
        wrap.innerHTML = `
          <div class="shell">
            <section class="panel">
              <div class="gallery">
                <div class="mainImg" id="mainImgBox">
                  <img id="mainImg" src="${safeText(primary)}" alt="${safeText(product.name)}" />
                </div>
                <div class="thumbs" id="thumbs"></div>
              </div>
            </section>

            <section class="panel">
              <div class="details">
                <h1 class="title" id="pTitle">${safeText(product.name)}</h1>
                <p class="desc" id="pDesc">${safeText(product.description || "")}</p>

                <div id="dealArea"></div>

                <div class="optRow">
                  <label for="variantSelect">Choose option</label>
                  <select id="variantSelect" aria-label="Select variant"></select>
                </div>

                <div class="actions">
                  <button class="btn" type="button" id="backBtn">Back</button>
                  <button class="btn primary" type="button" id="addBtn">Add to cart</button>
                </div>

                <div class="metaGrid">
                  <div class="metaCard">
                    <div class="metaKey">Variant</div>
                    <div class="metaVal" id="metaVariant">—</div>
                  </div>
                  <div class="metaCard">
                    <div class="metaKey">Price</div>
                    <div class="metaVal" id="metaPrice">—</div>
                  </div>
                </div>
              </div>
            </section>
          </div>
        `;

        // thumbs
        const thumbsEl = $("thumbs");
        const mainImg = $("mainImg");
        thumbs.forEach((t, idx) => {
          const b = document.createElement("button");
          b.type = "button";
          b.className = "thumb" + (idx === 0 ? " active" : "");
          b.setAttribute("aria-label", "Change image");
          b.innerHTML = `<img src="${safeText(t.src)}" alt="${safeText(t.alt)}" loading="lazy">`;
          b.addEventListener("click", () => {
            mainImg.src = t.src;
            thumbsEl.querySelectorAll(".thumb").forEach(x => x.classList.remove("active"));
            b.classList.add("active");
          });
          thumbsEl.appendChild(b);
        });

        // variants dropdown
        const select = $("variantSelect");
        if (!variants.length) {
          select.innerHTML = `<option value="">No variants</option>`;
          $("addBtn").disabled = true;
        } else {
          variants.forEach(v => {
            const opt = document.createElement("option");
            opt.value = v.id;
            opt.textContent = v.label ? `${v.label}` : `Variant ${v.id}`;
            select.appendChild(opt);
          });
          select.value = selectedVariant ? selectedVariant.id : variants[0].id;
        }

        // Deal rendering + timer
        let timerId = null;
        function renderDealForVariant(v){
          if (timerId) { clearInterval(timerId); timerId = null; }

          const dealArea = $("dealArea");
          if (!dealArea) return;

          const sp = v ? getSpecialForVariant(v.id) : null;

          if (!v) {
            dealArea.innerHTML = `<div class="notice">This product has no active variants.</div>`;
            return;
          }

          const basePrice = Number(v.price);
          const imgToUse = variantImage(v);

          // update image to variant image when variant changes
          if (mainImg && imgToUse) mainImg.src = imgToUse;

          if (!sp) {
            dealArea.innerHTML = `
              <div class="priceRow">
                <div class="priceNow" style="color:var(--text);">${formatMoney(basePrice)}</div>
              </div>
            `;
            return;
          }

          const finalPrice = calcDiscountedPrice(v.price, sp);
          let offLabel = "Deal";

          if (Number.isFinite(basePrice) && Number.isFinite(finalPrice) && basePrice > 0) {
            const pct = Math.round(((basePrice - finalPrice) / basePrice) * 100);
            if (pct > 0) offLabel = `${pct}% off`;
          } else if (sp.discount_type === "percentage") {
            const pct = Math.round(Number(sp.discount_value) || 0);
            if (pct > 0) offLabel = `${pct}% off`;
          }

          const endsAtMs = parseSpecialEpoch(sp.ends_at);
          const showTimer = endsAtMs && endsAtMs > Date.now();

          dealArea.innerHTML = `
            <div class="dealBox">
              <div class="dealTop">
                <span class="dealBadge">${safeText(offLabel)}</span>
                <span class="dealTimer" id="dealTimer">${showTimer ? `Ends in ${formatLeft(endsAtMs - Date.now())}` : `Limited time deal`}</span>
              </div>
              <div class="priceRow">
                <div class="priceNow">${finalPrice != null ? formatMoney(finalPrice) : "—"}</div>
                ${Number.isFinite(basePrice) ? `<div class="priceWas">${formatMoney(basePrice)}</div>` : ""}
              </div>
            </div>
          `;

          if (showTimer) {
            const tEl = $("dealTimer");
            timerId = setInterval(() => {
              const left = endsAtMs - Date.now();
              if (left <= 0) {
                if (tEl) tEl.textContent = "Deal ended";
                clearInterval(timerId);
                timerId = null;
                return;
              }
              if (tEl) tEl.textContent = `Ends in ${formatLeft(left)}`;
            }, 1000);
          }
        }

        function updateMeta(v){
          $("metaVariant").textContent = safeText(v?.label || "—");
          const sp = v ? getSpecialForVariant(v.id) : null;
          if (!v) { $("metaPrice").textContent = "—"; return; }

          if (!sp) {
            $("metaPrice").textContent = formatMoney(v.price);
            return;
          }
          const finalPrice = calcDiscountedPrice(v.price, sp);
          $("metaPrice").textContent = finalPrice != null ? formatMoney(finalPrice) : "—";
        }

        // initial render
        renderDealForVariant(selectedVariant);
        updateMeta(selectedVariant);

        // variant change
        select.addEventListener("change", () => {
          const v = variants.find(x => String(x.id) === String(select.value)) || null;
          selectedVariant = v;
          renderDealForVariant(v);
          updateMeta(v);

          // keep URL in sync (optional, but helpful)
          const url = new URL(window.location.href);
          url.searchParams.set("variant", select.value);
          window.history.replaceState({}, "", url.toString());
        });

        // back
        $("backBtn").addEventListener("click", () => {
          // if user came from products.html, go back; otherwise go to products
          if (document.referrer) history.back();
          else window.location.href = "products.html";
        });

        // add
        $("addBtn").addEventListener("click", async () => {
          if (!selectedVariant) return;
          await addToCart(product.id, selectedVariant.id, 1);
          alert("Added to cart");
        });
      }

      // ======= INIT =======
      async function init(){
        initTheme();
        initMobileNav();
        initSearch();
        await loadCategoriesIntoSearch();
        await refreshCartCount();

        const product = await loadProductBySlugOrId();
        document.title = `ETOAC | ${product.name || "Product"}`;

        const images = await loadProductImages(product.id);
        const variants = await loadVariants(product.id);

        const variantIds = variants.map(v => v.id);
        const specials = await loadActiveSpecialsForProduct(product.id, variantIds);

        renderPage(product, images, variants, specials);
      }

      init().catch(err => {
        console.error(err);
        const wrap = $("pageWrap");
        if (wrap) wrap.outerHTML = `<div class="notice">Error: ${safeText(err.message || err)}</div>`;
      });
    })();
  </script>
</body>
</html>
