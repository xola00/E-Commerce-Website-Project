<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ETOAC | Products</title>

  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* ========= RESET ========= */
    *{ box-sizing:border-box; }
    html,body{ margin:0; padding:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    a{ color:inherit; text-decoration:none; }
    img{ max-width:100%; display:block; }
    button,input,select{ font:inherit; }
    .sr-only{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }

    /* ========= THEME ========= */
    :root{
      --bg:#ffffff;
      --bg2:#f3f4f6;
      --text:#111827;
      --muted:#6b7280;
      --card:#ffffff;
      --border:#e5e7eb;
      --shadow:0 8px 24px rgba(17,24,39,.08);

      --nav:#408ef3;
      --nav2:#232f3e;
      --accent:#69f9fe;
      --link:#0b74de;
      --danger:#dc2626;
      --success:#10b981;
    }
    body[data-theme="dark"]{
      --bg:#0b1220;
      --bg2:#0f1a2d;
      --text:#e5e7eb;
      --muted:#94a3b8;
      --card:#0f1a2d;
      --border:#1f2a44;
      --shadow:0 10px 26px rgba(0,0,0,.35);
    }
    body{ background:var(--bg2); color:var(--text); }

    /* ========= HEADER ========= */
    .amz-header{ position:sticky; top:0; z-index:50; }
    .amz-header__top{
      display:grid;
      grid-template-columns: 1fr minmax(260px,740px) auto;
      gap:12px;
      align-items:center;
      padding:10px 12px;
      background:var(--nav);
      color:#fff;
    }
    .amz-brand{ display:flex; gap:10px; align-items:center; min-width:190px; }
    .amz-brand__logo{
      width:40px; height:40px; object-fit:contain;
      border-radius:8px; background:rgba(255,255,255,.06); padding:4px;
    }
    .amz-brand__name{ font-weight:900; line-height:1.1; font-size:14px; }
    .amz-brand__tagline{ font-size:12px; opacity:.85; }

    .amz-search{
      display:flex; background:#fff; border-radius:10px; overflow:hidden;
      border:2px solid transparent;
    }
    .amz-search:focus-within{ border-color:var(--accent); }
    .amz-search__select{ border:0; padding:10px 10px; background:#f3f4f6; color:#111827; max-width:170px; }
    .amz-search__input{ border:0; padding:10px 12px; width:100%; outline:none; }
    .amz-search__btn{
      border:0; background:var(--accent); padding:0 14px; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
    }
    .amz-search__btn svg{ width:20px; height:20px; fill:#111827; }

    .amz-actions{ display:flex; align-items:center; gap:10px; }
    .amz-action__btn{
      width:38px; height:38px; border-radius:10px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.06);
      color:#fff; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
    }
    .amz-action__btn svg{ width:18px; height:18px; fill:#fff; }

    .amz-action__link{
      display:flex; flex-direction:column; gap:2px;
      padding:6px 10px; border-radius:10px;
      border:1px solid rgba(255,255,255,.12);
    }
    .amz-action__small{ font-size:11px; opacity:.9; }
    .amz-action__big{ font-size:13px; font-weight:900; }

    .amz-cart{
      position:relative;
      display:flex; align-items:center; gap:8px;
      padding:8px 10px;
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.12);
      color:#fff; border-radius:10px; cursor:pointer;
    }
    .amz-cart__badge{
      position:absolute; top:-6px; left:18px;
      background:var(--danger); color:#fff;
      border-radius:999px; padding:2px 6px;
      font-size:12px; font-weight:900;
    }
    .amz-cart__text{ font-weight:900; font-size:13px; }

    .amz-navToggle{
      display:none;
      width:42px; height:42px;
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.12);
      border-radius:10px; cursor:pointer;
      flex-direction:column; justify-content:center; gap:5px;
      padding:0 10px;
    }
    .amz-navToggle span{ height:2px; background:#fff; border-radius:9px; display:block; }

    .amz-header__strip{
      display:flex; justify-content:space-between; gap:10px;
      padding:8px 12px;
      background:var(--nav2);
      color:#fff;
      overflow:auto;
    }
    .amz-strip__left{ display:flex; gap:10px; align-items:center; flex-wrap:nowrap; }
    .amz-strip__item{
      padding:6px 10px; border-radius:999px;
      border:1px solid rgba(255,255,255,.12);
      white-space:nowrap; font-size:13px;
    }

    /* ========= MAIN ========= */
    .amz-main{ padding:14px 12px 28px; max-width:1280px; margin:0 auto; }

    .pageHead{
      display:flex; align-items:baseline; justify-content:space-between; gap:12px;
      margin:6px 0 12px;
    }
    .pageHead h1{ margin:0; font-size:18px; }
    .pageHead .hint{ color:var(--muted); font-size:13px; }

    /* ========= GRID ========= */
    .grid{
      display:grid;
      grid-template-columns: repeat(5, 1fr);
      gap:12px;
    }

    /* ========= CARDS ========= */
    .card{
      border:1px solid var(--border);
      border-radius:8px;
      overflow:hidden;
      background:var(--bg);
      display:flex;
      flex-direction:column;
      min-height:160px;
      transition:transform 0.2s ease, box-shadow 0.2s ease;
      cursor:pointer;
    }
    .card:hover{
      transform:translateY(-2px);
      box-shadow:0 4px 12px rgba(0,0,0,.1);
    }
    .card__img{
      height:140px;
      background:var(--bg);
      display:flex; align-items:center; justify-content:center;
      border-bottom:1px solid var(--border);
    }
    .card__img img{
      max-height:120px;
      max-width:120px;
      object-fit:contain;
    }
    .card__body{ padding:10px; display:flex; flex-direction:column; gap:6px; }
    .card__title{ font-size:13px; font-weight:900; line-height:1.2; }
    .card__meta{ font-size:12px; color:var(--muted); }
    .price{ font-weight:900; }

    .btnRow{ display:flex; gap:8px; margin-top:6px; }
    .btn{
      border:1px solid var(--border);
      background:var(--bg2);
      color:var(--text);
      padding:8px 10px;
      border-radius:5px;
      cursor:pointer;
      font-weight:900;
      font-size:12px;
      flex:1;
      transition:all 0.2s ease;
    }
    .btn.primary{
      background:var(--accent);
      border-color:rgba(0,0,0,.15);
      color:#111827;
    }
    .btn:hover{ background:var(--border); }
    .btn.primary:hover{ background:var(--success); border-color:var(--success); }
    .btn:disabled{ opacity:.6; cursor:not-allowed; }

    .notice{
      border:1px dashed var(--border);
      border-radius:14px;
      background:rgba(255,255,255,.6);
      padding:12px;
      color:var(--muted);
      font-size:13px;
    }
    body[data-theme="dark"] .notice{ background:rgba(15,26,45,.6); }

    /* ========= MODAL ========= */
    .modalBackdrop{
      position:fixed; inset:0;
      background:rgba(0,0,0,.55);
      display:none;
      align-items:center;
      justify-content:center;
      padding:14px;
      z-index:100;
    }
    .modalBackdrop.open{ display:flex; }

    .modal{
      width:min(980px, 100%);
      max-height:min(88vh, 900px);
      overflow:auto;
      background:var(--card);
      border:1px solid var(--border);
      border-radius:12px;
      box-shadow:var(--shadow);
    }
    .modalHead{
      display:flex;
      justify-content:space-between;
      gap:10px;
      padding:12px;
      border-bottom:1px solid var(--border);
      position:sticky;
      top:0;
      background:var(--card);
      z-index:2;
    }
    .modalTitleWrap{ min-width:0; }
    .modalTitle{ margin:0; font-size:16px; font-weight:900; }
    .modalSub{ margin:4px 0 0; font-size:12px; color:var(--muted); }

    .modalClose{
      border:1px solid var(--border);
      background:var(--bg2);
      color:var(--text);
      border-radius:10px;
      padding:8px 10px;
      cursor:pointer;
      font-weight:900;
      height:fit-content;
    }

    .modalBody{ padding:12px; }
    .variantGrid{
      display:grid;
      grid-template-columns: repeat(3, 1fr);
      gap:12px;
    }

    /* ========= SPECIAL (DEAL) LOOK INSIDE MODAL ========= */
    .deal-card{
      border:2px solid var(--danger);
      border-radius:8px;
      overflow:hidden;
      background:var(--bg);
      display:flex;
      flex-direction:column;
    }
    .deal-card .card__img{
      height:140px;
      display:flex;
      align-items:center;
      justify-content:center;
      background: linear-gradient(to bottom, #fef3c7, #fde68a);
      border-bottom:1px solid rgba(0,0,0,.06);
    }
    .deal-card .card__img img{
      max-height:120px;
      max-width:120px;
      object-fit:contain;
    }
    .deal-badges{ display:flex; align-items:center; gap:8px; margin-top:2px; }
    .deal-badge{
      display:inline-flex; align-items:center;
      padding:3px 8px;
      border-radius:4px;
      background:var(--danger);
      color:#fff;
      font-weight:900;
      font-size:11px;
      line-height:1;
      width:fit-content;
    }
    .deal-timer{ font-size:11px; font-weight:800; color:var(--danger); }
    .deal-price{ display:flex; align-items:baseline; gap:6px; margin:4px 0; }
    .deal-now{ font-size:16px; font-weight:900; color:var(--danger); }
    .deal-was{ font-size:12px; color:var(--muted); text-decoration: line-through; }

    /* ========= RESPONSIVE ========= */
    @media (max-width:1200px){ .grid{ grid-template-columns: repeat(4, 1fr);} }
    @media (max-width:1000px){ .grid{ grid-template-columns: repeat(3, 1fr);} .variantGrid{ grid-template-columns: repeat(2, 1fr);} }
    @media (max-width:760px){
      .amz-header__top{
        grid-template-columns: 1fr auto;
        grid-template-areas:
          "brand actions"
          "search search";
      }
      .amz-brand{ grid-area:brand; min-width:0; }
      .amz-actions{ grid-area:actions; }
      .amz-search{ grid-area:search; }
      .amz-action__link{ display:none; }
      .amz-navToggle{ display:flex; }
      .amz-header__strip{ display:none; flex-direction:column; align-items:flex-start; }
      .amz-header__strip.open{ display:flex; }
      .grid{ grid-template-columns: repeat(2, 1fr); }
      .variantGrid{ grid-template-columns: 1fr; }
    }
    @media (max-width:420px){ .grid{ grid-template-columns: 1fr; } }
  </style>
</head>

<body data-page="products" class="amz">
  <!-- HEADER -->
  <header class="amz-header">
    <div class="amz-header__top">
      <a class="amz-brand" href="index.html" aria-label="Go to home">
        <img class="amz-brand__logo" src="images/logo.png" alt="ETOAC logo" />
        <div class="amz-brand__text">
          <div class="amz-brand__name">ETOAC Cleaning & Arts</div>
          <div class="amz-brand__tagline">Clean Spaces. Crafted Stories.</div>
        </div>
      </a>

      <form class="amz-search" id="searchForm" role="search">
        <select class="amz-search__select" id="searchCategory" aria-label="Search category">
          <option value="">All</option>
        </select>
        <input class="amz-search__input" id="searchInput" type="search" placeholder="Search products..." autocomplete="off" />
        <button class="amz-search__btn" type="submit" aria-label="Search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 2a8 8 0 105.293 14.293l4.707 4.707 1.414-1.414-4.707-4.707A8 8 0 0010 2zm0 2a6 6 0 110 12 6 6 0 010-12z"></path></svg>
        </button>
      </form>

      <div class="amz-actions">
        <button class="amz-action__btn" type="button" id="themeToggle" aria-pressed="false" title="Toggle theme">
          <span class="sr-only">Toggle theme</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        </button>

        <a class="amz-action__link" href="orders.html" title="Orders">
          <span class="amz-action__small">Returns</span>
          <span class="amz-action__big">& Orders</span>
        </a>

        <a class="amz-action__link" href="account.html" title="Account">
          <span class="amz-action__small">Hello</span>
          <span class="amz-action__big">Account</span>
        </a>

        <button class="amz-cart" type="button" onclick="window.location.href='cart.html'" aria-label="Open cart">
          <span class="amz-cart__icon" aria-hidden="true">🛒</span>
          <span class="amz-cart__badge" id="cart-count">0</span>
          <span class="amz-cart__text">Cart</span>
        </button>

        <button class="amz-navToggle" type="button" id="navToggle" aria-expanded="false" aria-controls="amzNav">
          <span></span><span></span><span></span>
          <span class="sr-only">Open menu</span>
        </button>
      </div>
    </div>

    <div class="amz-header__strip" id="amzNav">
      <div class="amz-strip__left">
           <a class="amz-strip__item" href="category.html?cat=cleaning">Cleaning</a>
<a class="amz-strip__item" href="category.html?cat=art">Art Work</a>
<a class="amz-strip__item" href="category.html?cat=outdoor">Outdoor</a>
        <a class="amz-strip__item" href="combos.html">Combos</a>
        <a class="amz-strip__item" href="specials.html">Specials</a>
        <a class="amz-strip__item" href="about.html">About</a>
        <a class="amz-strip__item" href="contact.html">Contact</a>
      </div>
    </div>
  </header>

  <main class="amz-main">
    <div class="pageHead">
      <div>
        <h1>Products</h1>
        <div class="hint">Click a product to view its variants. Specials will show as deal cards inside the variants list.</div>
      </div>
      <div class="hint" id="countHint"></div>
    </div>

    <div id="productsWrap">
      <div class="notice">Loading products…</div>
    </div>
  </main>

  <!-- VARIANTS MODAL -->
  <div class="modalBackdrop" id="variantModalBackdrop" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="variantModalTitle">
      <div class="modalHead">
        <div class="modalTitleWrap">
          <h2 class="modalTitle" id="variantModalTitle">Product</h2>
          <p class="modalSub" id="variantModalSub">Variants</p>
        </div>
        <button class="modalClose" type="button" id="variantModalClose">Close</button>
      </div>
      <div class="modalBody">
        <div id="variantsWrap"></div>
      </div>
    </div>
  </div>

  <script>
    /******************************************************************
     *  SUPABASE CLIENT
     ******************************************************************/
  

    (() => {
      const sb = window.supabaseClient;
      if (!sb) { alert("Supabase client not found."); return; }

      // ======= CONFIG =======
      const PRODUCT_IMAGES_BUCKET = "product-images";
      const FALLBACK_IMG = "images/Combo.jpg";

      const SPECIALS_TIME_MODE = "assume_jhb";
      const JHB_OFFSET = "+02:00";

      // ======= STATE =======
      let products = [];
      let variantsByProductId = new Map();
      let imagesByProductId = new Map();
      let specialsByVariantId = new Map();     // variant_id -> special
      let productWideSpecials = new Map();     // product_id -> special (when variant_id is null)

      // ======= HELPERS =======
      const $ = (id) => document.getElementById(id);
      function safeText(s){ return (s ?? "").toString(); }
      function isHttp(url){ return /^https?:\/\//i.test(url); }
      function formatMoney(amount){
        const n = Number(amount || 0);
        return "R " + n.toFixed(2);
      }
      function getSessionId(){
        const key = "etoac_session_id";
        let v = localStorage.getItem(key);
        if (!v) { v = "sess_" + crypto.randomUUID(); localStorage.setItem(key, v); }
        return v;
      }

      function productImageUrl(path){
        if (!path) return "";
        if (isHttp(path) || path.startsWith("images/") || path.startsWith("assets/")) return path;
        try {
          const { data } = sb.storage.from(PRODUCT_IMAGES_BUCKET).getPublicUrl(path);
          return data?.publicUrl || path;
        } catch { return path; }
      }

      function pickPrimaryImageFromList(images){
        const list = images || [];
        const primary = list.find(i => i.is_primary) || [...list].sort((a,b) => (a.sort_order||0)-(b.sort_order||0))[0];
        return primary ? productImageUrl(primary.path) : FALLBACK_IMG;
      }

      function pickDefaultVariant(variants){
        const list = (variants || []).filter(v => v.is_active !== false);
        if (!list.length) return null;
        return list.find(v => v.is_default) || [...list].sort((a,b)=>(a.sort_order||0)-(b.sort_order||0))[0];
      }

      function calcDiscountedPrice(basePrice, sp){
        const base = Number(basePrice);
        if (!Number.isFinite(base)) return null;
        const dv = Number(sp.discount_value);
        if (sp.discount_type === "percentage") return base * (1 - (dv / 100));
        if (sp.discount_type === "fixed_amount") return Math.max(0, base - dv);
        return base;
      }

      function formatLeft(ms){
        const total = Math.max(0, Math.floor(ms / 1000));
        const h = String(Math.floor(total / 3600)).padStart(2,"0");
        const m = String(Math.floor((total % 3600) / 60)).padStart(2,"0");
        const s = String(total % 60).padStart(2,"0");
        return `${h}:${m}:${s}`;
      }

      function parseSpecialEpoch(ts){
        if (!ts) return null;
        const raw = String(ts).trim();

        const first = new Date(raw);
        const firstOk = Number.isFinite(first.getTime());

        if (SPECIALS_TIME_MODE === "db_utc") return firstOk ? first.getTime() : null;

        const looksUTC =
          /Z$/i.test(raw) ||
          /\+00(?::?00)?$/i.test(raw) ||
          /\+0000$/i.test(raw);

        if (looksUTC) {
          const fixed = raw
            .replace(/Z$/i, JHB_OFFSET)
            .replace(/\+00(?::?00)?$/i, JHB_OFFSET)
            .replace(/\+0000$/i, JHB_OFFSET);

          const d = new Date(fixed);
          if (Number.isFinite(d.getTime())) return d.getTime();
        }

        return firstOk ? first.getTime() : null;
      }

      // ======= THEME / NAV =======
      function initTheme(){
        const key = "etoac_theme";
        const saved = localStorage.getItem(key);
        if (saved) document.body.setAttribute("data-theme", saved);

        const btn = $("themeToggle");
        if (!btn) return;
        btn.addEventListener("click", () => {
          const cur = document.body.getAttribute("data-theme") || "light";
          const next = cur === "dark" ? "light" : "dark";
          document.body.setAttribute("data-theme", next);
          localStorage.setItem(key, next);
          btn.setAttribute("aria-pressed", next === "dark" ? "true" : "false");
        });
      }

      function initMobileNav(){
        const toggle = $("navToggle");
        const nav = $("amzNav");
        if (!toggle || !nav) return;
        toggle.addEventListener("click", () => {
          const isOpen = nav.classList.toggle("open");
          toggle.setAttribute("aria-expanded", isOpen ? "true" : "false");
        });
      }

      // ======= SEARCH =======
      function initSearch(){
        const form = $("searchForm");
        const input = $("searchInput");
        const cat = $("searchCategory");
        if (!form || !input || !cat) return;

        form.addEventListener("submit", (e) => {
          e.preventDefault();
          const q = input.value.trim();
          const c = cat.value.trim();
          const params = new URLSearchParams();
          if (q) params.set("q", q);
          if (c) params.set("cat", c);
          // If you have shop.html search, keep this:
          window.location.href = `shop.html?${params.toString()}`;
        });
      }

      async function loadCategoriesIntoSearch(){
        const select = $("searchCategory");
        if (!select) return;

        const { data, error } = await sb
          .from("categories")
          .select("slug, name")
          .eq("is_active", true)
          .order("sort_order", { ascending: true });

        if (error) return;

        (data || []).forEach(c => {
          const opt = document.createElement("option");
          opt.value = c.slug;
          opt.textContent = c.name;
          select.appendChild(opt);
        });
      }

      // ======= CART COUNT =======
      async function refreshCartCount(){
        const sessionId = getSessionId();
        const { data, error } = await sb
          .from("cart")
          .select("quantity")
          .eq("session_id", sessionId);

        if (error) return;

        const count = (data || []).reduce((sum, r) => sum + (Number(r.quantity) || 0), 0);
        const el = $("cart-count");
        if (el) el.textContent = String(count);
      }

      async function addToCart(productId, variantId, qty=1){
        const sessionId = getSessionId();

        const { data: existing, error: selErr } = await sb
          .from("cart")
          .select("quantity")
          .eq("session_id", sessionId)
          .eq("product_id", productId)
          .eq("variant_id", variantId)
          .maybeSingle();

        if (selErr) console.warn("Cart select error:", selErr.message);

        if (existing?.quantity != null) {
          const newQty = (Number(existing.quantity) || 0) + qty;
          const { error: updErr } = await sb
            .from("cart")
            .update({ quantity: newQty })
            .eq("session_id", sessionId)
            .eq("product_id", productId)
            .eq("variant_id", variantId);
          if (updErr) { alert("Could not update cart: " + updErr.message); return; }
        } else {
          const { error: insErr } = await sb
            .from("cart")
            .insert({ session_id: sessionId, product_id: productId, variant_id: variantId, quantity: qty });
          if (insErr) { alert("Could not add to cart: " + insErr.message); return; }
        }

        await refreshCartCount();
      }

      // ======= LOAD PRODUCTS + VARIANTS + IMAGES =======
      async function loadCatalog(){
        const { data: prodRows, error: prodErr } = await sb
          .from("products")
          .select("id, category_id, name, slug, description, is_active, created_at")
          .eq("is_active", true)
          .order("name", { ascending: true })
          .limit(500);

        if (prodErr) throw prodErr;
        products = prodRows || [];

        const productIds = products.map(p => p.id);
        if (!productIds.length) return;

        const { data: varRows, error: varErr } = await sb
          .from("product_variants")
          .select("id, product_id, label, price, sort_order, is_default, is_active, Image_path")
          .in("product_id", productIds)
          .eq("is_active", true)
          .order("sort_order", { ascending: true });

        if (varErr) throw varErr;

        variantsByProductId = new Map();
        (varRows || []).forEach(v => {
          const arr = variantsByProductId.get(v.product_id) || [];
          arr.push(v);
          variantsByProductId.set(v.product_id, arr);
        });

        const { data: imgRows, error: imgErr } = await sb
          .from("product_images")
          .select("id, product_id, path, alt, sort_order, is_primary")
          .in("product_id", productIds)
          .order("is_primary", { ascending: false })
          .order("sort_order", { ascending: true });

        if (imgErr) throw imgErr;

        imagesByProductId = new Map();
        (imgRows || []).forEach(img => {
          const arr = imagesByProductId.get(img.product_id) || [];
          arr.push(img);
          imagesByProductId.set(img.product_id, arr);
        });
      }

      // ======= LOAD SPECIALS + BUILD MAPS =======
      async function loadSpecialsMap(){
        // Pull enough specials so variants can show correct pricing
        const { data, error } = await sb
          .from("specials")
          .select("id, title, description, discount_type, discount_value, product_id, variant_id, starts_at, ends_at, is_active, created_at")
          .eq("is_active", true)
          .order("created_at", { ascending: false })
          .limit(500);

        if (error) {
          console.warn("Specials load failed:", error.message);
          return;
        }

        const now = Date.now();
        const active = (data || []).filter(sp => {
          const startMs = parseSpecialEpoch(sp.starts_at);
          const endMs = parseSpecialEpoch(sp.ends_at);
          const startOk = (startMs == null) || (startMs <= now);
          const endOk = (endMs == null) || (endMs >= now);
          return startOk && endOk;
        });

        specialsByVariantId = new Map();
        productWideSpecials = new Map();

        // If multiple specials match, keep the most recent (created_at desc already)
        for (const sp of active) {
          if (sp.variant_id) {
            if (!specialsByVariantId.has(sp.variant_id)) specialsByVariantId.set(sp.variant_id, sp);
          } else if (sp.product_id) {
            if (!productWideSpecials.has(sp.product_id)) productWideSpecials.set(sp.product_id, sp);
          }
        }
      }

      function getSpecialForVariant(productId, variantId){
        // Variant-level special overrides product-wide
        const vsp = specialsByVariantId.get(variantId);
        if (vsp) return vsp;
        return productWideSpecials.get(productId) || null;
      }

      // ======= RENDER PRODUCTS GRID =======
      function renderProducts(){
        const wrap = $("productsWrap");
        const countHint = $("countHint");
        if (!wrap) return;

        if (countHint) countHint.textContent = `${products.length} product(s)`;

        if (!products.length) {
          wrap.innerHTML = `<div class="notice">No products available.</div>`;
          return;
        }

        wrap.innerHTML = `<div class="grid" id="productsGrid"></div>`;
        const grid = $("productsGrid");

        products.forEach(p => {
          const img = pickPrimaryImageFromList(imagesByProductId.get(p.id));
          const def = pickDefaultVariant(variantsByProductId.get(p.id));
          const price = def ? formatMoney(def.price) : "—";

          const card = document.createElement("div");
          card.className = "card";
          card.innerHTML = `
            <div class="card__img"><img src="${img}" alt="${safeText(p.name)}" loading="lazy"></div>
            <div class="card__body">
              <div class="card__title">${safeText(p.name)}</div>
              <div class="card__meta">${safeText((p.description || "").slice(0, 70))}</div>
              <div class="price">${price}</div>
              <div class="btnRow">
                <button class="btn" type="button" data-open>Variants</button>
                <button class="btn primary" type="button" data-view>View</button>
              </div>
            </div>
          `;

          card.querySelector("[data-open]").addEventListener("click", (e) => {
            e.stopPropagation();
            openVariantsModal(p);
          });

          card.querySelector("[data-view]").addEventListener("click", (e) => {
            e.stopPropagation();
            const url = p.slug ? `product.html?slug=${encodeURIComponent(p.slug)}` : `product.html?id=${encodeURIComponent(p.id)}`;
            window.location.href = url;
          });

          card.addEventListener("click", () => openVariantsModal(p));

          grid.appendChild(card);
        });
      }

      // ======= VARIANT CARD BUILDERS =======
      function buildNormalVariantCard(product, variant, imgUrl){
        const card = document.createElement("div");
        card.className = "card";
        card.style.cursor = "default";
        card.innerHTML = `
          <div class="card__img"><img src="${imgUrl}" alt="${safeText(product.name)} ${safeText(variant.label)}" loading="lazy"></div>
          <div class="card__body">
            <div class="card__title">${safeText(variant.label || "Variant")}</div>
            <div class="card__meta">${safeText(product.name)}</div>
            <div class="price">${formatMoney(variant.price)}</div>
            <div class="btnRow">
              <button class="btn" type="button" data-view>View</button>
              <button class="btn primary" type="button" data-add>Add</button>
            </div>
          </div>
        `;

        card.querySelector("[data-view]").addEventListener("click", () => {
          let url = product.slug ? `product.html?slug=${encodeURIComponent(product.slug)}` : `product.html?id=${encodeURIComponent(product.id)}`;
          url += `&variant=${encodeURIComponent(variant.id)}`;
          window.location.href = url;
        });

        card.querySelector("[data-add]").addEventListener("click", async () => {
          await addToCart(product.id, variant.id, 1);
        });

        return card;
      }

      function buildDealVariantCard(product, variant, imgUrl, sp){
        const basePrice = Number(variant.price);
        const finalPrice = calcDiscountedPrice(variant.price, sp);

        let offLabel = "Deal";
        if (Number.isFinite(basePrice) && Number.isFinite(finalPrice) && basePrice > 0) {
          const pct = Math.round(((basePrice - finalPrice) / basePrice) * 100);
          if (pct > 0) offLabel = `${pct}% off`;
        } else if (sp.discount_type === "percentage") {
          const pct = Math.round(Number(sp.discount_value) || 0);
          if (pct > 0) offLabel = `${pct}% off`;
        }

        const endsAtMs = parseSpecialEpoch(sp.ends_at);
        const showTimer = endsAtMs && endsAtMs > Date.now();

        const card = document.createElement("div");
        card.className = "deal-card";
        card.innerHTML = `
          <div class="card__img">
            <img src="${imgUrl}" alt="${safeText(product.name)} ${safeText(variant.label)}" loading="lazy">
          </div>
          <div class="card__body">
            <div class="deal-badges">
              <span class="deal-badge">${safeText(offLabel)}</span>
              <span class="deal-timer" data-timer>
                ${showTimer ? `Ends in ${formatLeft(endsAtMs - Date.now())}` : `Limited time deal`}
              </span>
            </div>

            <div class="deal-price">
              <div class="deal-now">${finalPrice != null ? formatMoney(finalPrice) : "—"}</div>
              ${Number.isFinite(basePrice) ? `<div class="deal-was">${formatMoney(basePrice)}</div>` : ""}
            </div>

            <div class="card__title">${safeText(variant.label || "Variant")}</div>
            <div class="card__meta">${safeText(product.name)}</div>

            <div class="btnRow">
              <button class="btn" type="button" data-view>View</button>
              <button class="btn primary" type="button" data-add ${finalPrice == null ? "disabled" : ""}>Add</button>
            </div>
          </div>
        `;

        card.querySelector("[data-view]").addEventListener("click", () => {
          let url = product.slug ? `product.html?slug=${encodeURIComponent(product.slug)}` : `product.html?id=${encodeURIComponent(product.id)}`;
          url += `&variant=${encodeURIComponent(variant.id)}`;
          url += `&special=${encodeURIComponent(sp.id)}`;
          window.location.href = url;
        });

        card.querySelector("[data-add]").addEventListener("click", async () => {
          await addToCart(product.id, variant.id, 1);
        });

        if (showTimer) {
          const el = card.querySelector("[data-timer]");
          const timerId = setInterval(() => {
            const left = endsAtMs - Date.now();
            if (left <= 0) {
              el.textContent = "Deal ended";
              clearInterval(timerId);
              return;
            }
            el.textContent = `Ends in ${formatLeft(left)}`;
          }, 1000);
        }

        return card;
      }

      // ======= MODAL =======
      function initModal(){
        const backdrop = $("variantModalBackdrop");
        const closeBtn = $("variantModalClose");

        function close(){
          backdrop.classList.remove("open");
          backdrop.setAttribute("aria-hidden", "true");
          document.body.style.overflow = "";
        }

        closeBtn.addEventListener("click", close);
        backdrop.addEventListener("click", (e) => {
          if (e.target === backdrop) close();
        });
        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape" && backdrop.classList.contains("open")) close();
        });

        return { open: () => {
          backdrop.classList.add("open");
          backdrop.setAttribute("aria-hidden", "false");
          document.body.style.overflow = "hidden";
        }, close };
      }

      const modal = initModal();

      function openVariantsModal(product){
        const title = $("variantModalTitle");
        const sub = $("variantModalSub");
        const wrap = $("variantsWrap");
        if (!wrap) return;

        title.textContent = safeText(product.name);
        sub.textContent = safeText(product.description || "Choose a variant");

        const variants = (variantsByProductId.get(product.id) || []).filter(v => v.is_active !== false);
        if (!variants.length) {
          wrap.innerHTML = `<div class="notice">No variants found for this product.</div>`;
          modal.open();
          return;
        }

        wrap.innerHTML = `<div class="variantGrid" id="variantGrid"></div>`;
        const grid = $("variantGrid");

        variants.forEach(v => {
          // Image priority: variant image -> product primary image -> fallback
          const imgUrl = v.Image_path ? productImageUrl(v.Image_path) : pickPrimaryImageFromList(imagesByProductId.get(product.id));

          const sp = getSpecialForVariant(product.id, v.id);
          const card = sp ? buildDealVariantCard(product, v, imgUrl, sp)
                          : buildNormalVariantCard(product, v, imgUrl);

          grid.appendChild(card);
        });

        modal.open();
      }

      // ======= INIT =======
      async function init(){
        initTheme();
        initMobileNav();
        initSearch();
        await loadCategoriesIntoSearch();
        await refreshCartCount();

        await loadCatalog();
        await loadSpecialsMap();

        renderProducts();
      }

      init().catch(err => {
        console.error(err);
        const wrap = $("productsWrap");
        if (wrap) wrap.innerHTML = `<div class="notice">Error loading page: ${safeText(err.message || err)}</div>`;
      });

    })();
  </script>
</body>
